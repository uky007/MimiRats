[package]
name = "MimiRats"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
byteorder = "1"
hex = "0.4"

# Crypto primitives (cross-platform)
md4 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
des = "0.8"
hmac = "0.12"
pbkdf2 = "0.12"
crc32fast = "1"
cipher = "0.4"
digest = "0.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    # Core
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    # Phase 2
    "Win32_System_Services",
    "Win32_System_EventLog",
    "Win32_System_Registry",
    # Phase 3
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    # Phase 5
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
]
